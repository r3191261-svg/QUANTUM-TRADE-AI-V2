name: QUANTUM TRADE AI

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: quantum-trade-ai
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check tokens
        env:
          TOKEN_USER: ${{ secrets.TOKEN_USER }}
          TOKEN_ADMIN: ${{ secrets.TOKEN_ADMIN }}
        run: |
          test -n "$TOKEN_USER"
          test -n "$TOKEN_ADMIN"

      - name: Start Telegram bots
        env:
          TOKEN_USER: ${{ secrets.TOKEN_USER }}
          TOKEN_ADMIN: ${{ secrets.TOKEN_ADMIN }}
          PYTHONUNBUFFERED: "1"
        run: python bot.py