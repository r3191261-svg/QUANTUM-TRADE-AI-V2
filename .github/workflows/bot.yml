name: QUANTUM TRADE AI

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Restart before the 350-minute per-run limit, while avoiding :00 peak load.
    - cron: "17 */5 * * *"

concurrency:
  group: quantum-trade-ai
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Restore persistent bot database
        uses: actions/cache/restore@v4
        with:
          path: quantum.db
          key: quantum-db-${{ github.run_id }}
          restore-keys: |
            quantum-db-

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify bot behavior
        run: python -m unittest discover -s tests -v

      - name: Check tokens
        env:
          TOKEN_USER: ${{ secrets.TOKEN_USER }}
          TOKEN_ADMIN: ${{ secrets.TOKEN_ADMIN }}
        run: |
          test -n "$TOKEN_USER"
          test -n "$TOKEN_ADMIN"

      - name: Start Telegram bots
        env:
          TOKEN_USER: ${{ secrets.TOKEN_USER }}
          TOKEN_ADMIN: ${{ secrets.TOKEN_ADMIN }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
          DEFAULT_ADMIN_ID: ${{ secrets.DEFAULT_ADMIN_ID }}
          ADMIN_IDS: ${{ secrets.ADMIN_IDS }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEWS_RSS_URL: ${{ vars.NEWS_RSS_URL }}
          NEWS_POLL_SECONDS: ${{ vars.NEWS_POLL_SECONDS }}
          NEWS_REPUBLISH_ALLOWED: ${{ vars.NEWS_REPUBLISH_ALLOWED }}
          MINI_APP_URL: ${{ vars.MINI_APP_URL }}
          PYTHONUNBUFFERED: "1"
        run: python bot.py

      - name: Save persistent bot database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: quantum.db
          key: quantum-db-${{ github.run_id }}
