services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quantum}
      POSTGRES_USER: ${POSTGRES_USER:-quantum}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - quantum_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  bot:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      TOKEN_USER: ${TOKEN_USER:?Set TOKEN_USER in .env}
      TOKEN_ADMIN: ${TOKEN_ADMIN:?Set TOKEN_ADMIN in .env}
      OWNER_ID: ${OWNER_ID:-}
      DEFAULT_ADMIN_ID: ${DEFAULT_ADMIN_ID:-}
      ADMIN_IDS: ${ADMIN_IDS:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-quantum}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-quantum}
      NEWS_RSS_URL: ${NEWS_RSS_URL:-https://www.investing.com/rss/news.rss}
      NEWS_POLL_SECONDS: ${NEWS_POLL_SECONDS:-300}
      NEWS_REPUBLISH_ALLOWED: ${NEWS_REPUBLISH_ALLOWED:-false}
      PYTHONUNBUFFERED: "1"

volumes:
  quantum_postgres:
